<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Game Night – e-Minimal</title>
    <link rel="stylesheet" href="/css/app.css" />
    <style>
  /* Game Night; the rest is /css/app.css. Fills follow the reader's board legend. */
  /* Fallbacks if /css/app.css fails to load; app.css wins when it loads. */
  :where(:root) { --paper: #f2f2ef; --surface: #fff; --ink: #000; --ink-2: #555; --ink-3: #8a8a8a; --rule: #d6d6d2; --rule-2: #eaeae6; --danger: #b3261e; --focus: #000; --serif: Georgia, serif; --sans: system-ui, sans-serif; --gutter: 16px; --topbar-h: 52px; --ctl-h: 40px; }
  :where(body) { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  :where(main) { display: block; margin: 0 auto; padding: 0 var(--gutter) 48px; }
  :where(.toast:not(.show)) { visibility: hidden; }
  :where(.topbar, .row) { display: flex; gap: 12px; justify-content: space-between; padding: 8px var(--gutter); }
  :root {
    --hatch: repeating-linear-gradient(-45deg, var(--ink) 0 1px, transparent 1px 5px);
    --cross: linear-gradient(to top right, transparent calc(50% - 1px), var(--paper) 0 calc(50% + 1px), transparent 0),
      linear-gradient(to bottom right, transparent calc(50% - 1px), var(--paper) 0 calc(50% + 1px), transparent 0);
  }
  main { max-width: calc(560px + 2 * var(--gutter)); padding-top: 16px; }
  [hidden] { display: none !important; }
  #status:empty { display: none; }
  #defs { position: absolute; width: 0; height: 0; color: var(--ink); }
  #sw { margin-top: -16px; }
  #sw .btn-group { flex-wrap: wrap; }
  #snd svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #snd[aria-pressed="true"] .off, #snd[aria-pressed="false"] .on { display: none; }
  main .card { display: flex; flex-direction: column; gap: 12px; }
  main .card > * { margin: 0; }
  .row > .chip + .chip { margin-left: -6px; }
  .chip-on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .sunk { text-decoration: line-through; }
  .vote { justify-content: space-between; }
  .word { padding: 12px 0; font: 600 2rem/1.2 var(--serif); text-align: center; overflow-wrap: anywhere; }
  .die { align-self: center; display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; border: 2px solid var(--ink); border-radius: 4px; font: 600 3.5rem/1 var(--serif); }
  .field-row > .num { flex: 0 0 72px; }

  .shp { flex: none; width: 26px; height: 26px; vertical-align: middle; }
  .shp * { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .shp text { fill: var(--ink); stroke: none; font: 700 11px var(--sans); text-anchor: middle; }
  h2 .shp { margin-right: 8px; }
  .chip .shp { width: 18px; height: 18px; margin-left: -6px; }
  .tile .shp { width: 56px; height: 56px; margin-bottom: 6px; }
  .lg span { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; white-space: nowrap; }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); font: inherit; text-align: center; cursor: pointer; }
  .tile:hover:not(:disabled) { border-color: var(--ink); }
  .tile:disabled { cursor: default; }
  .tile:disabled:not([aria-pressed="true"]) { opacity: .4; }
  .tile[aria-pressed="true"] { padding: 11px 7px; border: 2px solid var(--ink); outline: 3px solid var(--ink); outline-offset: 3px; }
  .tile:focus-visible { outline: 2px dashed var(--focus); outline-offset: 3px; }
  .tile b { font: 600 1rem/1.3 var(--serif); }
  .tile small { font-size: .8125rem; color: var(--ink-2); }

  /* Thumbnails, viewBox 0 0 100 100: f solid, o outline, h/d light/dark hatch, p paper */
  .th { display: block; width: 100%; max-width: 96px; height: auto; margin-bottom: 6px; }
  .th * { fill: none; }
  .th .f { fill: currentColor; }
  .th .p { fill: var(--surface); }
  .th .h { fill: url(#h1); }
  .th .d { fill: url(#h2); }
  .th .o { stroke: currentColor; stroke-width: 2; }
  .th .t { stroke-width: 1.3; }
  .th .w { stroke-width: 3; }
  .th .x { stroke: var(--surface); stroke-width: 2.2; }
  .th .g { stroke: currentColor; stroke-width: .8; }
  .th .q { fill: currentColor; stroke: var(--surface); stroke-width: 3; paint-order: stroke; font: 700 18px var(--sans); text-anchor: middle; }

  /* Codenames: k<kind> tile, t<kind> fill; rv revealed, key the spymaster's hidden key */
  .cn { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .ct { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 52px; padding: 4px 1px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); font: 600 .6875rem/1.2 var(--sans); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .ct:not(:disabled) { border-color: var(--ink); cursor: pointer; }
  .ct[aria-pressed="true"] { padding: 4px 3px; box-shadow: inset 0 0 0 3px var(--ink); }
  .ct > i { position: absolute; inset: 0; border-radius: 3px; }
  .ct > span { position: relative; border-radius: 2px; }
  .rv { border-color: var(--ink); }
  .rv.k1, .rv.k3 { color: var(--paper); }
  .rv.k2 { border-width: 2px; }
  .rv.k3 > span, .k2 > span { padding: 0 1px; background: var(--surface); }
  .rv.k3 > span { background: var(--ink); }
  .key > i { opacity: .3; }
  .t0 { background: linear-gradient(var(--ink), var(--ink)) center / calc(100% - 6px) 2px no-repeat; }
  .t1 { background: var(--ink); }
  .t2 { background: var(--hatch); }
  .t3 { background: var(--cross), var(--ink); }
  .lg i { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--ink); border-radius: 2px; }

  .bs { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; }
  .bs > button { min-width: 0; aspect-ratio: 1; padding: 0; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); }
  .bs > button:not(:disabled) { cursor: pointer; }
  .bs > .wa:not(:disabled) { border-color: var(--ink-3); }
  .bs > .sh { background: var(--ink); border-color: var(--ink); }
  .bs > .cur { background: var(--hatch); border-color: var(--ink); }
  .bs > .hit { background: var(--cross), var(--ink); border-color: var(--ink); }
  .bs > .ms { background: radial-gradient(circle, var(--ink) 0 2.5px, transparent 3px); }
    </style>
  </head>
  <body>
    <svg id="defs" aria-hidden="true" focusable="false">
      <pattern id="h1" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M1 0V5" stroke="currentColor" stroke-width="1.2" />
      </pattern>
      <pattern id="h2" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M1 0V3" stroke="currentColor" stroke-width="1.6" />
      </pattern>
    </svg>
    <header class="topbar">
      <div class="topbar-title" id="title">Game Night</div>
      <div class="topbar-status" id="chip"></div>
      <button type="button" class="btn btn-sm btn-icon" id="snd" aria-pressed="true" aria-label="Sound">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9h4l5-4v14l-5-4H3z" />
          <path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
          <path class="off" d="M16 9l6 6M22 9l-6 6" />
        </svg>
      </button>
    </header>
    <main>
      <div class="toolbar toolbar-sticky" id="sw" hidden></div>
      <p class="muted" id="status">Connecting to the reader…</p>
      <div id="view"></div>
      <div id="table"></div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
  // A closure: a global var cannot shadow the read-only window.orientation phones have.
  (function () {
  var token = null;
  try { token = localStorage.getItem("cpgToken"); } catch (e) { token = null; }
  var state = null;
  var prev = null; // the last reply for this view, for sound diffs
  var mySeat = -1; // s.me
  var asSeat = -1, asName = ""; // the test seat being played, -1 for my own
  var gen = 0; // bumped to drop replies in flight
  var sigSw = "", sigView = "", sigTable = "";
  var shipDir = "h", placingShip = 0, clueWord = "", clueCount = 1, nameDraft = "", joinError = "", joinOffer = "";
  var picked = -1; // the Codenames tile picked on this phone; it reaches the reader only on Guess
  var lost = false, pollAt = 0, toastTimer = 0;
  var KIND = ["bystander", "red", "blue", "assassin"];
  var CLUE_UNLIMITED = 10; // Codenames::UNLIMITED
  var SHAPES = ["Circle", "Square", "Triangle", "Diamond"];
  var CORNERS = ["Top left", "Top right", "Bottom right", "Bottom left"];

  function el(id) { return document.getElementById(id); }

  function text(tag, content, cls) {
    var e = document.createElement(tag);
    e.textContent = content;
    if (cls) e.className = cls;
    return e;
  }

  function div(cls) { return text("div", "", cls); }

  function button(label, cls, onClick, disabled) {
    var b = text("button", label, cls);
    b.type = "button";
    if (disabled) b.disabled = true;
    else b.onclick = onClick;
    return b;
  }

  function input(id, type, value, onInput) {
    var i = document.createElement("input");
    i.id = id;
    i.type = type;
    i.value = value;
    i.oninput = function () { onInput(i.value); };
    return i;
  }

  function card(box, title, chip) {
    var c = text("section", "", "card"), h = text("h2", title);
    if (chip) {
      var head = div("card-head");
      head.appendChild(h);
      head.appendChild(text("span", chip, "chip"));
      c.appendChild(head);
    } else {
      c.appendChild(h);
    }
    box.appendChild(c);
    return c;
  }

  function toast(msg, sticky, fine) {
    var t = el("toast");
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.className = fine ? "toast show" : "toast toast-danger show";
    if (!sticky) toastTimer = setTimeout(hideToast, 3000);
  }

  function hideToast() { el("toast").classList.remove("show"); }

  // app.js is not loaded: a small confirm in app.css's modal markup (Esc, backdrop, Tab, focus).
  function ask(title, body, ok, then) {
    if (el("askTitle")) return;
    var back = div("modal-backdrop open"), box = div("modal"), head = div("modal-head"), foot = div("modal-foot");
    var opener = document.activeElement, id = opener && opener.id, h = text("h2", title), mid = div("modal-body");
    var no = button("Cancel", "btn", close), yes = button(ok, "btn btn-danger", function () { close(); then(); });
    function close() {
      document.removeEventListener("keydown", key);
      document.body.removeChild(back);
      var f = (id && el(id)) || opener;
      if (f && f.focus) f.focus();
    }
    function key(e) {
      if (e.key === "Escape") close();
      else if (e.key === "Tab") { e.preventDefault(); (document.activeElement === no ? yes : no).focus(); }
    }
    h.id = "askTitle";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.setAttribute("aria-labelledby", "askTitle");
    head.appendChild(h);
    mid.appendChild(text("p", body));
    foot.appendChild(no);
    foot.appendChild(yes);
    box.appendChild(head);
    box.appendChild(mid);
    box.appendChild(foot);
    back.appendChild(box);
    back.onclick = function (e) { if (e.target === back) close(); };
    document.addEventListener("keydown", key);
    document.body.appendChild(back);
    no.focus();
  }

  function player(s, seat) {
    var ps = s.players || [];
    for (var i = 0; i < ps.length; i++) if (ps[i].s === seat) return ps[i];
    return null;
  }

  function nameOf(s, seat) {
    var p = player(s, seat);
    return p ? p.n : "Seat " + (seat + 1);
  }

  // Only the host of a test-mode build plays test seats.
  function canSwitch(s) {
    var p = player(s, mySeat);
    return s.testMode === true && !!token && !!p && !!p.host;
  }

  function hostLine(s, what) {
    var h = (s.players || []).filter(function (p) { return p.host; })[0];
    return asSeat >= 0 && canSwitch(s) ? "Switch back to " + nameOf(s, mySeat) + " to " + what + "."
      : "Only " + (h ? h.n : "the host") + ", the host, can " + what + ".";
  }

  function rejoinable(s) {
    return (s.players || []).filter(function (p) { return p.away && !p.test; }).map(function (p) { return p.n; });
  }

  // Rebuilds a section and restores focus and caret, so a repaint keeps the keyboard up.
  function rebuild(box, fill) {
    var a = document.activeElement, id = a && a.id && box.contains(a) ? a.id : "", from = null, to = null;
    try { from = a.selectionStart; to = a.selectionEnd; } catch (e) {}
    box.innerHTML = "";
    fill(box);
    var f = id && el(id);
    if (f) {
      f.focus();
      try { if (from != null) f.setSelectionRange(from, to); } catch (e) {}
    }
  }

  function call(path, method, then) {
    var g = gen;
    return fetch(path, { method: method, cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (lost) { lost = false; hideToast(); }
        if (g !== gen) return;
        try {
          (then || apply)(data);
        } catch (e) {
          // A bug, not the network: log it and let the next poll rebuild everything.
          sigSw = sigView = sigTable = "";
          console.error(e);
        }
      }, function () { lost = true; toast("Lost the reader – retrying", true); });
  }

  function stale() {
    gen++;
    prev = null;
  }

  function asQuery() { return asSeat >= 0 ? "&as=" + asSeat : ""; }

  function poll(force) {
    // One poll at a time, unless the last hung for 5 s.
    if (!force && Date.now() - pollAt < 5000) return;
    pollAt = Date.now();
    call("/api/game/state" + (token ? "?t=" + token + asQuery() : ""), "GET").then(function () { pollAt = 0; });
  }

  function act(verb, a, b, c, words, own) {
    if (!token) return;
    var url = "/api/game/act?t=" + token + (own ? "" : asQuery()) + "&v=" + verb;
    if (a != null) url += "&a=" + a;
    if (b != null) url += "&b=" + b;
    if (c != null) url += "&c=" + c;
    if (words) url += "&s=" + encodeURIComponent(words);
    call(url, "POST");
  }

  // Host-only verbs go as this phone: the reader refuses them for a test seat.
  function hostAct(verb, a) { act(verb, a, null, null, "", true); }

  // The captive-portal sheet and the browser keep separate storage; rejoining by name recovers the seat.
  function join(name, again) {
    name = (name || nameDraft).trim();
    if (!name) return toast("Pick a name first");
    call("/api/game/join?name=" + encodeURIComponent(name) + (again ? "&rejoin=1" : ""), "POST", function (data) {
      if (!data.t) {
        joinError = data.error || "The table is full";
        joinOffer = data.rejoin || "";
        sigView = "";
        return state && render();
      }
      token = data.t;
      joinError = joinOffer = "";
      stale(); // drops tokenless polls in flight
      try { localStorage.setItem("cpgToken", token); } catch (e) {}
      if (data.rejoined) toast("Welcome back, " + name, false, true);
      poll(true);
    });
  }

  function forget() {
    token = null;
    mySeat = asSeat = -1;
    stale();
    try { localStorage.removeItem("cpgToken"); } catch (e) {}
  }

  function leave() {
    ask("Leave the table?", "You give up your seat. Join again from this page to play.", "Leave", function () {
      if (!token || state.phase !== "lobby") return; // the reader keeps seats while a round is on
      call("/api/game/leave?t=" + token, "POST", function (data) {
        if (data.error) return toast(data.error);
        forget();
        poll(true);
      });
    });
  }

  function switchTo(seat, name) {
    if (seat === asSeat) return;
    asSeat = seat;
    asName = name;
    stale();
    placingShip = 0;
    clueWord = "";
    picked = -1;
    if (state) render();
    poll(true);
  }

  function apply(s) {
    if (!s || s.v === undefined) return;
    if (s.me !== undefined) mySeat = s.me;
    else if (asSeat < 0) mySeat = s.seat;
    // A token the reader no longer knows (it rebooted) is dead.
    if (mySeat === -1 && token) forget();
    if (asSeat >= 0) {
      var p = player(s, asSeat), next = asSeat;
      if (!canSwitch(s)) {
        next = -1;
      } else if (!p || !p.test || p.n !== asName) {
        // Seats are packed at a round start: follow the test player by name.
        next = -1;
        (s.players || []).forEach(function (q) { if (q.test && q.n === asName) next = q.s; });
      } else if (s.seat !== asSeat) {
        next = -1; // the reader answered as this phone
      }
      if (next !== asSeat) {
        asSeat = next;
        if (next < 0) asName = "";
        stale();
        return poll(true);
      }
    }
    try {
      if (prev) cues(prev, s).filter(String).slice(0, 3).forEach(function (n, i) { play(n, i * .18); });
    } catch (e) {
      console.error(e);
    }
    prev = s;
    state = s;
    render();
  }


  function render() {
    var s = state, ps = s.players || [];
    // A pick lasts while this phone can still guess that tile.
    var tile = s.game === "codenames" && s.g && (s.g.tiles || [])[picked];
    if (!tile || tile.r || !myTurn(s) || s.g.spymaster) picked = -1;
    el("title").textContent = s.phase === "lobby" ? "Game Night" : s.title || "Game Night";
    el("status").textContent = s.status || "";

    var chip = el("chip");
    var label = s.seat < 0 ? "Watching" : asSeat >= 0 ? "Playing as " + nameOf(s, asSeat) : s.host ? "Host" : "Seat " + (s.seat + 1);
    if (chip.textContent !== label) {
      chip.innerHTML = "";
      chip.appendChild(text("span", label, asSeat >= 0 ? "chip chip-on" : "chip"));
    }

    // Rebuild only what changed, so polls do not steal focus.
    var tests = ps.filter(function (p) { return p.test; });
    var on = canSwitch(s) && tests.length > 0;
    var sig = on ? [mySeat, asSeat, nameOf(s, mySeat)].concat(tests.map(function (p) { return p.s + p.n; })).join() : "";
    if (sig !== sigSw) {
      sigSw = sig;
      rebuild(el("sw"), function (box) {
        box.hidden = !on;
        if (on) switcher(box, s, tests);
      });
    }
    // The join card and the game views skip s.v, so typing a name or a clue survives other players' polls.
    sig = s.seat < 0 ? ["join", s.phase === "lobby", joinError, joinOffer, rejoinable(s)].join()
      : [s.phase === "lobby" ? s.v : JSON.stringify(s.g), s.seat, s.phase, s.over, s.host, s.canStart, s.testMode, mySeat, asSeat,
        shipDir, placingShip, picked, ps.map(function (p) { return p.n + p.host; })].join();
    if (sig !== sigView) {
      sigView = sig;
      rebuild(el("view"), function (box) { view(box, s); });
    }
    sig = JSON.stringify(ps) + [s.seat, mySeat, s.phase, s.game].join() + JSON.stringify(s.g && s.g.seats);
    if (sig !== sigTable) {
      sigTable = sig;
      rebuild(el("table"), function (box) { table(box, s); });
    }
  }

  function switcher(box, s, tests) {
    box.appendChild(text("span", "Playing as", "small muted"));
    var group = div("btn-group");
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Playing as");
    [{ s: mySeat, n: nameOf(s, mySeat) }].concat(tests).forEach(function (p) {
      var mine = p.s === mySeat;
      var b = button(p.n, "btn btn-sm", function () { switchTo(mine ? -1 : p.s, p.n); });
      b.id = "sw" + p.s;
      b.setAttribute("aria-pressed", mine ? asSeat < 0 : asSeat === p.s);
      group.appendChild(b);
    });
    box.appendChild(group);
  }

  function view(box, s) {
    if (s.seat < 0) return joinCard(box, s);
    if (s.phase === "lobby") return lobby(box, s);
    if (s.over) overCard(box, s);
    var draw = { undercover: undercover, codenames: codenames, battleship: battleship, ludo: ludo }[s.game];
    if (draw) draw(box, s, s.g || {});
    if (!s.over) roundCard(box, s);
  }

  function joinCard(box, s) {
    var open = s.phase === "lobby", c = card(box, open ? "Join the table" : "A round is on"), back = rejoinable(s);
    if (!open) c.appendChild(text("p", "Rejoin under your name, or watch it on the reader.", "small muted"));
    var f = div("field"), label = text("label", "Your name");
    var name = input("nameInput", "text", nameDraft, function (v) { nameDraft = v; });
    label.htmlFor = "nameInput";
    name.maxLength = 12;
    name.autocomplete = "nickname";
    name.setAttribute("enterkeyhint", "go");
    name.onkeydown = function (e) { if (e.key === "Enter") join(); };
    f.appendChild(label);
    f.appendChild(name);
    c.appendChild(f);
    if (joinError) {
      var err = text("p", joinError, "small text-danger");
      err.setAttribute("role", "alert");
      c.appendChild(err);
    }
    if (joinOffer) c.appendChild(button("Rejoin as " + joinOffer, "btn btn-block", function () { join(joinOffer, true); }));
    c.appendChild(button("Join", "btn btn-primary btn-block", function () { join(); })).id = "joinBtn";
    back = back.filter(function (n) { return n !== joinOffer; });
    if (back.length) c.appendChild(text("h3", "Were you playing?"));
    back.forEach(function (n) { c.appendChild(button("Rejoin as " + n, "btn btn-block", function () { join(n, true); })); });
  }

  function lobby(box, s) {
    var ps = s.players || [], c = card(box, s.host ? "Pick a game" : "Up next"), grid = div("tiles");
    grid.setAttribute("role", "group");
    grid.setAttribute("aria-label", "Games");
    (s.games || []).forEach(function (g) {
      var b = button("", "tile", function () { if (g.k !== s.game) hostAct("pick", g.i); }, !s.host);
      b.id = "game" + g.i;

      if (x.phase === "clue" && y.phase === "guess") out.push("chime");
      (y.tiles || []).forEach(function (t, i) {
        if (!t.r || ((x.tiles || [])[i] || {}).r) return;
        out.push("flip");
        if (t.k === 3) out.push("alarm");
        else if (y.myTeam) out.push(t.k === y.myTeam ? "ding" : "buzz");
      });
    } else if (b.game === "undercover") {
      var alive = function (u) { return u.alive; }, ready = function (u) { return u.ready; };
      if (x.phase !== "vote" && y.phase === "vote") out.push("bell");
      if (count(y.seats, alive) < count(x.seats, alive)) out.push("sting");
      else if (count(y.seats, ready) > count(x.seats, ready)) out.push("tick");
    }
    return out;
  }

  // The reader's picker art, from the same layouts (viewBox 0 0 100 100).

  function rect(x, y, w, h, cls, rx) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" class="' + cls + '"/>';
  }
  function path(d, cls) { return '<path d="' + d + '" class="' + cls + '"/>'; }
  function dot(x, y, r, cls) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" class="' + cls + '"/>'; }
  function cross(x, y, n, cls) { return path("M" + x + " " + y + "l" + n + " " + n + "m0-" + n + "l-" + n + " " + n, cls); }

  var ART = {
    undercover: function () {
      var o = "";
      for (var i = 0; i < 4; i++) {
        var x = 4 + i * 24, cls = i === 2 ? "h o" : "f";
        o += dot(x + 10, 37, 6, cls) + path("M" + x + " 69V53a8 8 0 0 1 8-8h4a8 8 0 0 1 8 8V69Z", cls);
      }
      return o + '<text x="62" y="64" class="q">?</text>';
    },
    // R solid, B hatched, N struck, A crossed, . plain.
    codenames: function () {
      var map = "R.B.N" + ".RA.B" + "B.R.." + ".N.BR" + "R..B.", o = "";
      for (var i = 0; i < 25; i++) {
        var x = 1 + (i % 5) * 20, y = 1 + ((i / 5) | 0) * 20, k = map.charAt(i);
        o += rect(x, y, 18, 18, k === "R" || k === "A" ? "f" : k === "B" ? "h o t" : "o t");
        if (k === "N") o += path("M" + (x + 3) + " " + (y + 9) + "h12", "o");
        if (k === "A") o += cross(x + 3.5, y + 3.5, 11, "x");
      }
      return o;
    },
    battleship: function () {
      var map = "......" + ".SSSX." + "....o." + ".o...." + "...X.S" + ".....S", lines = "", o = "";
      for (var i = 1; i < 6; i++) lines += "M" + (2 + i * 16) + " 2V98M2 " + (2 + i * 16) + "H98";
      for (i = 0; i < 36; i++) {
        var x = 2 + (i % 6) * 16, y = 2 + ((i / 6) | 0) * 16, k = map.charAt(i);
        if (k === "S") o += rect(x, y, 16, 16, "f");
        if (k === "X") o += cross(x + 3, y + 3, 10, "o");
        if (k === "o") o += dot(x + 8, y + 8, 2, "f");
      }
      return path(lines, "g") + o + rect(2, 2, 96, 96, "o w");
    },
    // Yards clockwise from top left, each nest holding that corner's shape; a die in the middle.
    ludo: function () {
      var yards = [[0, 0, "f"], [60, 0, "o"], [60, 60, "h o t"], [0, 60, "d o t"]], o = "";
      for (var i = 0; i < 4; i++) {
        var x = yards[i][0], y = yards[i][1];
        o += rect(x, y, 40, 40, yards[i][2]) + rect(x + 8, y + 8, 24, 24, "p o t") +
          '<g transform="translate(' + (x + 10.4) + " " + (y + 10.4) + ') scale(.8)">' + outline(i, "p o") + "</g>";
      }
      o += rect(42, 42, 16, 16, "p o", 2.5);
      var pips = [46, 46, 54, 46, 50, 50, 46, 54, 54, 54];
      for (i = 0; i < 10; i += 2) o += dot(pips[i], pips[i + 1], 1.4, "f");
      return o + rect(1.5, 1.5, 97, 97, "o w");
    }
  };

  function thumb(key) {
    return '<svg class="th" viewBox="0 0 100 100" aria-hidden="true">' + (ART[key] ? ART[key]() : rect(5, 5, 90, 90, "o")) + "</svg>";
  }

  poll(true);
  setInterval(function () { poll(); }, 1200);
  })();
    </script>
  </body>
