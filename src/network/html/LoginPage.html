<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Enter code – e-Minimal</title>
    <style>
      :root { color-scheme: light dark; --paper: #f2f2ef; --surface: #fff; --ink: #000; --ink-2: #555; --rule: #d6d6d2; --danger: #b3261e; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #000; --surface: #141414; --ink: #f2f2ef; --ink-2: #b0b0b0; --rule: #2a2a2a; --danger: #ff6b62; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); }
      main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 24px; }
      h1 { font: 600 1.25rem/1.3 Georgia, serif; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: var(--ink-2); }
      input { width: 100%; height: 52px; font: 600 1.75rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .4em; text-align: center; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; }
      input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
      button { width: 100%; height: 44px; margin-top: 12px; font: inherit; font-weight: 600; color: var(--paper); background: var(--ink); border: 0; border-radius: 6px; }
      button:disabled { opacity: .5; }
      #msg { min-height: 1.5em; margin: 12px 0 0; color: var(--danger); }
    </style>
  </head>
  <body>
    <main>
      <h1>e-Minimal</h1>
      <p>Enter the 6-digit code shown on the reader.</p>
      <form id="f" autocomplete="off">
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-label="Access code" autofocus />
        <button id="go" type="submit">Continue</button>
        <p id="msg" role="alert"></p>
      </form>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('f');
        var input = document.getElementById('code');
        var go = document.getElementById('go');
        var msg = document.getElementById('msg');
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var code = input.value.trim();
          if (!/^[0-9]{6}$/.test(code)) {
            msg.textContent = 'The code is 6 digits.';
            return;
          }
          go.disabled = true;
          msg.textContent = '';
          fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'code=' + encodeURIComponent(code)
          }).then(function (r) {
            if (r.ok) {
              location.reload();
              return;
            }
            return r.json().catch(function () { return {}; }).then(function (j) {
              msg.textContent = r.status === 429
                ? 'Too many tries. Wait ' + (j.retryAfter || 60) + ' seconds.'
                : 'Wrong code. Check the reader screen.';
              input.value = '';
              input.focus();
              go.disabled = false;
            });
          }).catch(function () {
            msg.textContent = 'Could not reach the reader.';
            go.disabled = false;
          });
        });
      });
    </script>
  </body>
</html>
